name: Release

# The only path that may publish @squaredlemons/canvas-panels.
#
# It runs on `main` and nowhere else. There is deliberately no
# `workflow_dispatch` here: a manual trigger can be aimed at any ref, which
# would make "the protected path" mean "whatever a maintainer typed". A failed
# run is re-run from the Actions UI, which keeps the ref it already had. The
# publishing job re-checks the ref anyway, so a trigger added later cannot
# quietly widen it.
#
# The package is published to the public npm registry through trusted
# publishing: the npm CLI exchanges this run's OIDC identity token for a
# registry credential scoped to this package, which expires with the job. No
# npm credential is stored in this repository, and none can be. The registered
# trusted publisher names this workflow by filename, so renaming this file
# stops publishing until the registration on npmjs.com is updated to match.
#
# Nothing is published without the complete Package Gate passing first. The gate
# runs twice on purpose: once across the supported Node versions, and once more
# inside `pnpm release:publish` on the runner that publishes, so the tarball that
# reaches the registry is the one that was just verified.

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Never cancelled: a half-run release is worse than a queued one.
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: Package Gate on Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run the complete Package Gate
        run: pnpm gate

  release:
    name: Version or publish
    needs: gate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      # Changesets pushes the release tag and creates the GitHub release.
      contents: write
      # The publish credential, and the only place it is granted. This mints the
      # OIDC token the npm CLI exchanges at the registry; there is nothing else
      # to grant, and no stored secret it stands in for.
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
          scope: "@squaredlemons"

      # setup-node on Node 22 ships npm 10, which has no idea OIDC exists. It
      # would not fail the run — it would look for a token it cannot find and
      # publish with no attestation, or not at all. Trusted publishing needs
      # 11.5.1 or later, so the floor is installed explicitly rather than
      # inherited from whatever the runner image happens to carry this month.
      - name: Install an npm that can do trusted publishing
        run: npm install -g npm@^11.5.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Publish only. There is deliberately no `version:` step here: this
      # organization does not permit GitHub Actions to create pull requests, so
      # a Version Packages pull request cannot be opened and never has been.
      # Versioning is a local `pnpm release:version`, reviewed as the commit
      # that carries it — the same scrutiny at the same moment, through a
      # mechanism that exists. With no `version:` step, a pending Changeset
      # simply waits: this job publishes what the manifest says and nothing else.
      - name: Publish through Changesets
        uses: changesets/action@v1
        with:
          publish: pnpm release:publish
        env:
          # Used by Changesets to write the version commit and open its pull
          # request. It is not a publishing credential and cannot publish: the
          # registry credential is minted by the OIDC exchange above and never
          # appears here.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
