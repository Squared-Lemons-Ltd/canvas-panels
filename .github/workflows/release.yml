name: Release

# The only path that may publish @squared-lemons-ltd/canvas-panels.
#
# It runs on `main` and nowhere else. There is deliberately no
# `workflow_dispatch` here: a manual trigger can be aimed at any ref, which
# would make "the protected path" mean "whatever a maintainer typed". A failed
# run is re-run from the Actions UI, which keeps the ref it already had. The
# publishing job re-checks the ref anyway, so a trigger added later cannot
# quietly widen it.
#
# The package is published to GitHub Packages, whose registry authenticates a
# run with the automatic `GITHUB_TOKEN`: minted for this workflow run, scoped by
# the `packages: write` permission below, and expired the moment the job ends.
# No long-lived publishing credential exists anywhere in this repository, and
# none is stored as a secret.
#
# Nothing is published without the complete Package Gate passing first. The gate
# runs twice on purpose: once across the supported Node versions, and once more
# inside `pnpm release:publish` on the runner that publishes, so the tarball that
# reaches the registry is the one that was just verified.

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Never cancelled: a half-run release is worse than a queued one.
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: Package Gate on Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run the complete Package Gate
        run: pnpm gate

  release:
    name: Version or publish
    needs: gate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      # Changesets writes the version commit, the changelog, and the release tag.
      contents: write
      # And opens the Version Packages pull request that reviews them.
      pull-requests: write
      # The publish credential, and the only place it is granted.
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@squared-lemons-ltd"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Version or publish through Changesets
        uses: changesets/action@v1
        with:
          version: pnpm release:version
          publish: pnpm release:publish
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The registry credential is the same run-scoped token, which is what
          # `actions/setup-node` wrote the .npmrc for. It is not a stored secret
          # and it cannot outlive this job.
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GitHub Packages does not serve npm provenance attestations.
          NPM_CONFIG_PROVENANCE: "false"
