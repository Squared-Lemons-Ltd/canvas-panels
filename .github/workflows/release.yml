name: Release

# The only path that may publish @squaredlemons/canvas-panels.
#
# It runs on `main` and nowhere else. There is deliberately no
# `workflow_dispatch` here: a manual trigger can be aimed at any ref, which
# would make "the protected path" mean "whatever a maintainer typed". A failed
# run is re-run from the Actions UI, which keeps the ref it already had. The
# publishing job re-checks the ref anyway, so a trigger added later cannot
# quietly widen it.
#
# The package is published to the public npm registry through trusted
# publishing: the npm CLI exchanges this run's OIDC identity token for a
# registry credential scoped to this package, which expires with the job. No
# npm credential is stored in this repository, and none can be. The registered
# trusted publisher names this workflow by filename, so renaming this file
# stops publishing until the registration on npmjs.com is updated to match.
#
# Nothing is published without the complete Package Gate passing first. The gate
# runs twice on purpose: once across the supported Node versions, and once more
# inside `pnpm release:publish` on the runner that publishes, so the tarball that
# reaches the registry is the one that was just verified.

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Never cancelled: a half-run release is worse than a queued one.
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: Package Gate on Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run the complete Package Gate
        run: pnpm gate

  release:
    name: Publish
    needs: gate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      # Pushing the release tags that `changeset publish` writes.
      contents: write
      # The publish credential, and the only place it is granted. This mints the
      # OIDC token the npm CLI exchanges at the registry; there is nothing else
      # to grant, and no stored secret it stands in for.
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      # Deliberately no `registry-url` or `scope`. Given either, setup-node
      # writes an .npmrc containing `_authToken=${NODE_AUTH_TOKEN}` and sets
      # that variable to the literal placeholder `XXXXX-XXXXX-XXXXX-XXXXX`.
      # npm then believes it already has a credential, never attempts the OIDC
      # exchange, and publishes with a junk token — and the registry answers an
      # unauthorized publish with `404`, not `401`, so it reads as a missing
      # package rather than a rejected credential. The registry is named in the
      # manifest's `publishConfig` instead, where it cannot fabricate a token.
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # setup-node on Node 22 ships npm 10, which has no idea OIDC exists. It
      # would not fail the run — it would look for a token it cannot find and
      # publish with no attestation, or not at all. Trusted publishing needs
      # 11.5.1 or later, so the floor is installed explicitly rather than
      # inherited from whatever the runner image happens to carry this month.
      - name: Install an npm that can do trusted publishing
        run: npm install -g npm@^11.5.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `changesets/action` is deliberately not used. It does not branch on
      # whether a `version:` step was configured — it branches on whether a
      # Changeset is pending, and with one present it always takes the
      # version-and-pull-request path, falling back to a default version
      # command. This organization forbids GitHub Actions from creating pull
      # requests, so that path can only ever fail here: it pushed a
      # `changeset-release/main` branch and then died listing the pull request
      # it wanted to open. A code path that cannot succeed is worse than no code
      # path, because it fails on the perfectly reasonable act of landing a
      # Changeset and lands the red run on whoever pushed next.
      #
      # So the publish is an ordinary step. Versioning is a local
      # `pnpm release:version`, reviewed as the commit that carries it — the
      # same scrutiny at the same moment, through a mechanism that exists.
      # A pending Changeset is now inert: this publishes whatever the manifest
      # already says, and a version already on the registry is a no-op.
      - name: Publish
        run: pnpm release:publish

      # `changeset publish` writes a git tag per published version and nothing
      # pushes them by itself. Nothing to push is not a failure: an unchanged
      # version publishes nothing and tags nothing.
      - name: Push the release tags
        run: git push --tags
