name: CI

# Pull requests only. A push to `main` is gated by the Release workflow, which
# runs `pnpm gate` across the same Node versions before it publishes — running
# CI there as well gated every commit twice over, four identical legs deep, and
# proved nothing the release path had not already proved.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint and check dependency boundaries
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Run contract tests
        run: pnpm test

      - name: Build package and fixtures
        run: pnpm build

      - name: Verify packed clean consumers
        run: pnpm pack:check
