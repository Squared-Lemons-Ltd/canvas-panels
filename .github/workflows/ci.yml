name: CI

# Pull requests only. A push to `main` is gated by the Release workflow, which
# runs `pnpm gate` across the same Node versions before it publishes — running
# CI there as well gated every commit twice over, four identical legs deep, and
# proved nothing the release path had not already proved.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint and check dependency boundaries
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Run contract tests
        run: pnpm test

      - name: Build package and fixtures
        run: pnpm build

      - name: Verify packed clean consumers
        run: pnpm pack:check
